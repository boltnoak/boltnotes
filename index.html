<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BoltNotes</title>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/boltnoak/boltnotes/main/build/tray-icon.png">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <div class="home-main">

            <p class="name">BOLTNOTES</p>
            <p class="info">Notes, Games Backlog and Fortnite Season Reviews, all in one place.</p>
            <div class="home-main-downloads">
