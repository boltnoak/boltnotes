<!DOCTYPE html>
<html lang="pt-br">
<head>
    <base href="../">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BoltNotes</title>
    <link rel="stylesheet" href="css/index.css">
    <script src="scripts/theme-loader.js"></script>
</head>
<body>
<div class="app-container">
    <div class="pageBody">
    <div class="banner">
        <div class="boltnotes-logo-div">
            <div class="boltnotes-logo"></div>
        </div>
    </div>
    <div class="banner-bar"></div>
    <div class="pages-section">
        <a class="page" id="games" href="pages/games.html">
            <div class="page-image">
                <img src="assets://games-backlog-characters.png">
                <div class="text">
                    <i class="games-backlog-icon fa-solid fa-gamepad"></i>
                    <p class="text-backlog">BACKLOG DE</p>
                    <p class="text-games">JOGOS</p>
                </div>
            </div>
            <!-- <p class="page-title">Backlog de Jogos</p> -->
            <div class="info">
                <p id="games-zerados"></p>
                <p id="games-platinados"></p>
            </div>
        </a>
        <a class="page" id="notes" href="pages/notes.html">
            <div class="page-image">
                <div class="page-image-sidebar">
                    <div></div>
                    <div></div>
                </div>
                <p class="text-notes">NOTAS</p>
            </div>
            <!-- <p class="page-title">Notas</p> -->
            <div class="info">
                <p id="note-count"></p>
            </div>
        </a>
        <a class="page" id="fortnite" href="pages/fortnite.html">
            <div class="page-image">
                <img src="assets://fortnite-character.png">
                <div class="fortnite-text">
                    <div class="fortnite-icon"></div>
                    <div class="page-image-text"></div>
                    <p class="text-br">BATTLE ROYALE</p>
                </div>
            </div>
            <!-- <p class="page-title">Fortnite</p> -->
            <div class="info">
                <p id="chapter-count"></p>
                <p id="season-count"></p>
            </div>
        </a>
    </div>
    <div class="sep-bar"></div>
    <div class="page-infos">
            <div id="featured-title">Destaque</div>
            <div class="playingNow-panel">
                <div id="playingNow-games"></div>
            </div>
            
            <div class="recentSeason-panel">
                <div class="recent-season">
                    <div class="recentSeason-image" id="recentSeason-image">
                        <div class="shine-effect-v-latest-season"></div>
                    </div>
                    <div class="season-status">
                        <p id="recent-season-name">Nome</p>
                        <div class="season-status-div">
                            <p class="status">
                                <i class="fa-solid fa-square-caret-up"></i>
                                Níveis: 
                                <i class="statusLevel-add fa-solid fa-plus"></i> <span class="status-level">~</span>
                                <i class="statusLevel-minus fa-solid fa-minus"></i>
                            </p>
                            <p class="status">
                                <i class="fa-solid fa-trophy"></i>
                                Vitórias: 
                                <i class="statusWin-add fa-solid fa-plus"></i> <span class="status-win">~</span>
                                <i class="statusWin-minus fa-solid fa-minus"></i>
                            </p>
                        </div>
                        <div class="level-progress">
                            <p class="level-progress-text">Progresso</p>
                            <div class="level-progress-bar">
                                <p class="level-progress-bar-fill"></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <header>
        <div class="app-version">
            <span id="app-version"></span>
        </div>
        <a class="config" href="pages/config.html">
            <i id="config" class="fa-solid fa-gear" data-tooltip="Configurações"></i>
        </a>
    </header>

    <div id="changelog-popup">
        <div class="changelog-content">
            <div class="changelog-title">
                <h2 id="changelog-version"></h2>
                <i id="close-changelog-btn" class="fa-solid fa-xmark"></i>
            </div>
            <p class="changelog-sep-bar"></p>
            <ul id="changelog-list"></ul>
        </div>
    </div>

    <div id="loading-screen">
        <div class="spinner"></div>
    </div>

    <div id="starting-screen">
        <div class="loading-content">
            <h2 id="loading-title">Sincronizando Assets</h2>

            <div class="spinner-div">
                <div class="spinner"></div>
            </div>
            <div class="loading-details-div">
                <p id="loading-details">Verificando pacotes...</p>
                <p id="loading-progress"></p>
            </div>
            
            <div class="progress-container">
                <div id="progress-bar-fill">
                    <div class="shine-effect"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="game-popup-div">
    <div class="game-popup">
        <div class="game-banner-div">
            <img class="game-banner">
            <img class="game-logo" alt="WALL E">
        </div>
            <div class="game-status-div">
            <div class="game-popup-status">
                <div class="campaign-status-tag"></div>
                <div class="campaign-status-change">
                    <li class="option-ajogar" data-value="ajogar">À Jogar</li>
                    <li class="option-jogando" data-value="jogando">Jogando</li>
                    <li class="option-zerado" data-value="zerado">Zerado</li>
                </div>
                <div class="achie-status-tag"></div>
                <div class="achie-status-change">
                    <li class="option-aplatinar" data-value="aplatinar">À Platinar</li>
                    <li class="option-platinando" data-value="platinando">Platinando</li>
                    <li class="option-platinado" data-value="platinado">Platinado</li>
                </div>
            </div>
            <div class="game-popup-info">
                <div class="game-releaseDate">LANÇADO EM<p class="game-releaseDate-text"></p></div>
                <div class="dev-pub">DEVELOPER<div class="game-popup-title"><p class="dev-name"></p></div></div>
                <div class="dev-pub">PUBLISHER<div class="game-popup-title"><p class="pub-name"></p></div></div>
            </div>
        </div>
        <div class="game-content">
            <div class="game-popup-campaign-achie">
                <div class="game-achievements">
                    <div>
                        <div class="achie-info-title"><p class="achie-info-title-text">CONQUISTAS</p><p class="achie-info-title-numbers"></p></div>
                        <div class="achie-info">
                            <p class="achie-percentage"></p>
                            <div class="achie-bar"><div class="achie-bar-fill"></div></div>
                        </div>
                    </div>
                    <div class="achie-add-minus">
                        <i id="achie-add" onclick="changeAchieProgress(this, true)" class="fa-solid fa-plus"></i>
                        <i id="achie-minus" onclick="changeAchieProgress(this, false)" class="fa-solid fa-minus"></i>
                    </div>
                </div>
                <div class="game-popup-sep-bar achie-sep"></div>
                <div class="game-campaign-div">
                    <div class="campaign-info-title"><p class="campaign-info-title-text"></p><p class="achie-info-title-numbers"></p></div>
                    <div class="campaign-info">
                        <p class="game-popup-completeDate"></p>
                    </div>
                </div>
                 <div class="game-popup-sep-bar campaign-sep"></div>
                    <div class="game-rating-div">
                    <div class="game-rating-title"><p class="game-rating-title-text">NOTA</p></div>
                    <div class="rating-info">
                        <p class="game-popup-rating"></p>
                    </div>
                </div>
            </div>
        </div>
        
    </div>
</div>

<script src="scripts/global.js"></script>
<script src="scripts/basics.js"></script>
<script src="scripts/index.js"></script>
</body>
</html>
