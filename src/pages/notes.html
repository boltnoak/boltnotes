<!DOCTYPE html>
<html lang="pt-br" data-i18n-title="notes_page_title">
<head>
    <base href="../">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/notes.css">
    <script src="scripts/theme-loader.js"></script>
    <script src="scripts/apply-locales.js"></script>
    <script src="scripts/fn-sidebar.js"></script>
</head>
<body>
        <div class="title-bar">
            <div class="note-list-bar" style="display: flex;">
                <div>
                    <p data-i18n="notes">Notes</p>
                    <i id="newNote-add" class="normal-btn fa-solid fa-plus"></i>
                    <i id="toggleDeleteBtns" class="normal-btn fa-solid fa-delete-left"></i>
                </div>
            </div>
            <div class="open-note-bar">
                <div>
                    <p id="title-note" contenteditable="true"></p>
                    <i id="exit-note" class="normal-btn fa-solid fa-arrow-left" onclick="exitNote()"></i>
                </div>
                <i id="edit-note" class="normal-btn fa-solid fa-file-pen"></i>
            </div>
        </div>
        <div id="note-list">
            <div id="tabs"></div>
        </div>
        <!-- <p class="sep-bar-v"></p> -->
        <div class="note-view">
            <!-- <p class="note-sep-bar"></p> -->
            <div id="content">
                <div class="boltnotes-logo-div">
                    <p class="notes-logo" data-i18n="select-note">Selecione uma nota</p>
                </div>
            </div>
        </div>

<script src="scripts/shell-pageloader.js"></script>
<script src="scripts/sortable.min.js"></script>
<script src="scripts/global.js"></script>
<script src="scripts/basics.js"></script>
<script src="scripts/notes.js"></script>
</body>
</html>
