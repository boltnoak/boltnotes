<!DOCTYPE html>
<html lang="pt-br" data-i18n-title="notes_page_title">
<head>
    <script>
        if (localStorage.getItem('sidebarExpanded') === 'true') {
            document.documentElement.classList.add('sidebar-expanded');
        }
    </script>
    <base href="../">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BoltNotes | Notas</title>
    <link rel="stylesheet" href="css/notes.css">
    <script src="scripts/theme-loader.js"></script>
    <script src="scripts/apply-locales.js"></script>
    <script src="scripts/fn-sidebar.js"></script>
</head>
<body>
<div class="app-container">
    <div class="pageBody">
        <div id="note-list">
            <div class="note-list-title-div">
                <div>
                    <p class="note-list-title" data-i18n="notes">Notas</p>
                    <!-- <i id="editSorting" class="fa-solid fa-arrow-down-up-across-line"></i> -->
                    <i id="toggleDeleteBtns" class="fa-solid fa-delete-left"></i>
                </div>
                <i id="newNote-add" class="fa-solid fa-plus"></i>
            </div>
            <!-- <p class="sep-bar"></p> -->
            <div id="tabs"></div>
        </div>
        <p class="sep-bar-v"></p>
        <div class="note-view">
            <div class="title-bar">
                <p id="title-note" contenteditable="true"></p>
                <i id="edit-note" class="fa-solid fa-file-pen"></i>
            </div>
            <!-- <p class="note-sep-bar"></p> -->
            <div id="content">
                <div class="boltnotes-logo-div">
                    <p class="notes-logo" data-i18n="select-note">Selecione uma nota</p>
                </div>
            </div>
        </div>
    </div>

    <header>
        <div class="sidebar-header-logo">
            <img src="assets/boltnotes-icon.png">
            <span>BoltNotes</span>
        </div>
        <a class="sidebar-btn" href="pages/games.html">
            <i class="fa-solid fa-gamepad"></i>
            <span data-i18n="games-backlog">Voltar</span>
        </a>
        <a class="sidebar-btn active" href="pages/notes.html">
            <i class="fa-solid fa-note-sticky"></i>
            <span data-i18n="notes">Notas</span>
        </a>
        <a class="sidebar-btn" href="pages/fortnite.html">
            <div class="sidebar-fortnite-icon"></div>
            <span data-i18n="fortnite">Fortnite</span>
        </a>
        
        <div class="sidebar-bottom">
            <a id="update-btn" class="sidebar-btn">
                <i class="fa-solid fa-arrow-rotate-right"></i>
                <span data-i18n="update">Atualizar</span>
            </a>
            <a class="sidebar-btn" href="pages/index.html">
                <i class="fa-solid fa-house"></i>
                <span data-i18n="home">Início</span>
            </a>
            <a class="config sidebar-btn" href="pages/config.html">
                <i id="config" class="fa-solid fa-sliders"></i>
                <span data-i18n="settings">Configurações</span>
            </a>
        </div>
    </header>
</div>

<script src="scripts/sortable.min.js"></script>
<script src="scripts/global.js"></script>
<script src="scripts/basics.js"></script>
<script src="scripts/notes.js"></script>
</body>
</html>
