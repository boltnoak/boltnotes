<!DOCTYPE html>
<html lang="pt-br">
<head>
    <script>
        if (localStorage.getItem('sidebarExpanded') === 'true') {
            document.documentElement.classList.add('sidebar-expanded');
        }
    </script>
    <base href="../">
    <script src="scripts/fortnite/track.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BoltNotes | Fortnite</title>
    <link rel="stylesheet" href="css/fortnite/chapter.css">
    <script src="scripts/theme-loader.js"></script>
    <script src="scripts/apply-locales.js"></script>
</head>
<body>
    <div class="app-container">
        <div class="pageBody"><div id="seasons-list-container"></div></div>
        <footer></footer>
    </div>
    <div class="map-popup" id="map-popup" style="display:none;">
        <div class="mapPopup-div">
            <div class="mapPopup-content">
                <i id="map-close" class="fa-solid fa-xmark" onclick="closeMap();"></i>
                <div id="mapPopup-image"></div>
            </div>
        </div>
    </div>
    <div class="download-status-div">
        <div class="download-status">
            <p class="download-status-text"><span data-i18n="downloading">Baixando</span>...</p>
            <p class="download-status-name"></p>
            <div class="download-status-progress-div">
                <p class="download-status-percentage">0%</p>
                <div class="download-status-progress-bar">
                    <div class="download-status-progress-bar-fill"></div>
                </div>
            </div>
        </div>
    </div>

    <header>
        <div class="sidebar-header-logo">
            <img src="assets/boltnotes-icon.png">
            <span>BoltNotes</span>
        </div>
        <a class="sidebar-btn" href="pages/games.html">
            <i class="fa-solid fa-gamepad"></i>
            <span data-i18n="games-backlog">Voltar</span>
        </a>
        <a class="sidebar-btn" href="pages/notes.html">
            <i class="fa-solid fa-note-sticky"></i>
            <span data-i18n="notes">Notas</span>
        </a>
        <a class="sidebar-btn" href="pages/fortnite.html">
            <div class="sidebar-fortnite-icon"></div>
            <span data-i18n="fortnite">Fortnite</span>
        </a>
        <div class="sidebar-sep-bar"></div>
        
        <div class="sidebar-chapter-section"></div>

        <div class="sidebar-bottom">
            <div class="header-sep-bar"></div>
            <a class="sidebar-btn" href="pages/fortnite.html">
                <i class="fa-solid fa-angle-left"></i>
                <span data-i18n="back">Voltar</span>
            </a>
            <a class="sidebar-btn" href="pages/index.html">
                <i class="fa-solid fa-house"></i>
                <span data-i18n="home">Início</span>
            </a>
            <a class="config sidebar-btn" href="pages/config.html">
                <i id="config" class="fa-solid fa-sliders"></i>
                <span data-i18n="settings">Configurações</span>
            </a>
        </div>
    </header>

    <script src="scripts/global.js"></script>
    <script src="scripts/basics.js"></script>
    <script src="scripts/videoplayer.js"></script>
    <script src="scripts/fortnite/chapter.js"></script>
    <script src="scripts/fortnite/reviews.js"></script>
    <script src="scripts/fortnite/trailers.js"></script>
</body>
</html>
