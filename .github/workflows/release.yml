name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: npm ci

      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libopenjp2-tools flatpak ostree flatpak-builder

      - name: Configure Flathub remote
        run: |
          sudo flatpak remote-add --if-not-exists --system flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Install Flatpak Runtime and BaseApp
        run: |
          sudo flatpak install --system -y flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08 org.electronjs.Electron2.BaseApp//24.08

      - name: Build Linux
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          DEBUG: electron-builder,electron-compile,@malept/flatpak-bundler
        run: npx electron-builder --linux AppImage flatpak --publish always

      - name: Publish Flatpak repo to GitHub Pages
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          # Clona a branch gh-pages (ou cria se não existir)
          git clone --branch gh-pages https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/boltnoak/boltnotes.git gh-pages-repo || \
          (git init gh-pages-repo && cd gh-pages-repo && git checkout -b gh-pages && git remote add origin https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/boltnoak/boltnotes.git)

          cd gh-pages-repo

          mkdir -p flatpak
          if [ ! -d "flatpak/objects" ]; then
            ostree init --mode=archive-z2 --repo=flatpak
          fi

          # Importa o flatpak gerado pelo electron-builder para dentro da pasta flatpak
          flatpak build-import-bundle flatpak ../dist/*.flatpak

          # Atualiza o repositório e gera o summary necessário
          flatpak build-update-repo --title="BoltNotes Flatpak" flatpak

          git add flatpak
          git commit -m "Update Flatpak repo for ${{ github.ref_name }}" || echo "nothing to commit"
          git push origin gh-pages --force

  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: npm ci

      - name: Build Windows
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npx electron-builder --win nsis --publish always