name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build Python Executable
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          # pip install -r requirements.txt # Descomente se tiver dependências
          pyinstaller --onefile src/scripts/games-finished.py --distpath scripts/dist/linux

      - run: npm ci

      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libopenjp2-tools rpm createrepo-c

      - name: Build Linux
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npx electron-builder --linux AppImage rpm --publish always

      - name: Publish RPM repo to GitHub Pages
        run: |
          git clone --branch gh-pages https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/boltnoak/boltnotes.git gh-pages-repo

          mkdir -p gh-pages-repo/rpm/x86_64
          cp dist/boltnotes-linux-x86_64.rpm gh-pages-repo/rpm/x86_64/
          createrepo_c gh-pages-repo/rpm/x86_64

          cd gh-pages-repo
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add rpm/x86_64
          git commit -m "Update RPM repo for ${{ github.ref_name }}" || echo "Nada para commitar"
          git push

  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build Python Executable
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          # pip install -r requirements.txt # Descomente se tiver dependências
          pyinstaller --onefile src/scripts/games-finished.py --distpath scripts/dist/win

      - run: npm ci

      - name: Clean build artifacts and kill locked processes
        shell: powershell
        run: |
          Get-Process -Name "games-finished" -ErrorAction SilentlyContinue | Stop-Process -Force
          if (Test-Path "dist") { Remove-Item -Recurse -Force "dist" }

      - name: Build Windows
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npx electron-builder --win nsis --publish always