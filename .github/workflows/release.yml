name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: npm ci

      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libopenjp2-tools flatpak ostree flatpak-builder

      - name: Build Linux
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          DEBUG: electron-builder,electron-compile,@malept/flatpak-bundler
        run: npx electron-builder --linux AppImage flatpak --publish always

      - name: Publish Flatpak repo to GitHub Pages
        run: |
          git clone --branch gh-pages https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/boltnoak/boltnotes.git gh-pages-repo

          mkdir -p gh-pages-repo/flatpak
          if [ ! -d "gh-pages-repo/flatpak/objects" ]; then
            ostree init --mode=archive-z2 --repo=gh-pages-repo/flatpak
          fi

          flatpak build-import-bundle gh-pages-repo/flatpak dist/*.flatpak

          flatpak build-update-repo --title="BoltNotes Flatpak" gh-pages-repo/flatpak

          cd gh-pages-repo
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add flatpak
          git commit -m "Update Flatpak repo for ${{ github.ref_name }}" || echo "nothing to commit"
          git push

  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: npm ci

      - name: Build Windows
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npx electron-builder --win nsis --publish always