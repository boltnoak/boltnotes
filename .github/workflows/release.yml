name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build Python Executable
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          # pip install -r requirements.txt # Descomente se tiver dependências
          pyinstaller --onefile src/scripts/games-finished.py --distpath scripts/dist/linux

      - run: npm ci

      - name: Install Linux dependencies
        run: sudo apt-get install -y libopenjp2-tools

      - name: Build Linux
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npx electron-builder --linux AppImage --publish always

  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build Python Executable
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          # pip install -r requirements.txt # Descomente se tiver dependências
          pyinstaller --onefile src/scripts/games-finished.py --distpath scripts/dist/win

      - run: npm ci

      - name: Clean build artifacts and kill locked processes
        shell: powershell
        run: |
          Get-Process -Name "games-finished" -ErrorAction SilentlyContinue | Stop-Process -Force
          if (Test-Path "dist") { Remove-Item -Recurse -Force "dist" }

      - name: Build Windows
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npx electron-builder --win nsis --publish always