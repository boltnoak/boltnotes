name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: npm ci

      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libopenjp2-tools flatpak ostree flatpak-builder appstream

      - name: Configure Flathub remote
        run: |
          sudo flatpak remote-add --if-not-exists --system flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Install Flatpak Runtime and BaseApp
        run: |
          sudo flatpak install --system -y flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08 org.electronjs.Electron2.BaseApp//24.08

      - name: Build Linux
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npx electron-builder --linux AppImage flatpak --publish always
      
      - name: Import GPG key
        run: echo "${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}" | gpg --batch --import

      - name: Publish Flatpak repo to GitHub Pages
        env:
          KEYID: ${{ secrets.FLATPAK_GPG_KEY_ID }}
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          git clone --branch gh-pages https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/boltnoak/boltnotes.git gh-pages-repo || \
          (git init gh-pages-repo && cd gh-pages-repo && git checkout -b gh-pages && git remote add origin https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/boltnoak/boltnotes.git)

          cd gh-pages-repo
          touch .nojekyll

          mkdir -p flatpak
          if [ ! -d "flatpak/objects" ]; then
            ostree init --mode=archive-z2 --repo=flatpak
          fi

          flatpak build-import-bundle --gpg-sign="$KEYID" flatpak ../dist/*.flatpak

          flatpak build-update-repo --gpg-sign="$KEYID" --generate-static-deltas \
            --prune --prune-depth=2 --title="BoltNotes Flatpak" flatpak

          echo "--- refs no repo ---"
          ostree refs --repo=flatpak

          cat <<EOF > boltnotes.flatpakrepo
          [Flatpak Repo]
          Title=BoltNotes
          Title[en]=BoltNotes
          Title[pt_BR]=BoltNotes
          Url=https://boltnoak.github.io/boltnotes/flatpak
          Homepage=https://github.com/boltnoak/boltnotes
          Comment=Repositório Flatpak do BoltNotes
          Comment[en]=BoltNotes Flatpak Repository
          Comment[pt_BR]=Repositório Flatpak do BoltNotes
          SuggestRemoteName=boltnotes
          GPGKey=$(gpg --export "$KEYID" | base64 -w0)
          RuntimeRepo=https://dl.flathub.org/repo/flathub.flatpakrepo
          EOF

          git add .nojekyll flatpak/ boltnotes.flatpakrepo
          git commit -m "Update Flatpak repo and .flatpakrepo for ${{ github.ref_name }}" || echo "nothing to commit"
          git push origin gh-pages --force

  windows:
    runs-on: windows-latest
    needs: linux

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: npm ci

      - name: Build Windows
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npx electron-builder --win nsis --publish always